# Optional scheduled disk-hygiene workflow for self-hosted runners.
# Complements the on-box reaper in provision-box.sh by reclaiming Docker build
# cache and old runner _diag logs when a runner's disk crosses a threshold.
# It deliberately leaves containers, networks, volumes, and package caches alone:
# those shared resources may belong to another runner working on the same machine.
# Copy into your repo's .github/workflows/ and adjust the label if needed.
name: ci-runner-disk-hygiene
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min
  workflow_dispatch: {}
concurrency:
  # Avoid overlapping copies of this maintenance workflow. This does not prevent
  # ordinary CI jobs from running, so cleanup below is intentionally conservative.
  group: little-ci-disk-hygiene
  cancel-in-progress: false
jobs:
  clean:
    runs-on: [self-hosted, little-ci]
    steps:
      - name: Reclaim disk if above threshold
        shell: bash
        run: |
          set -euo pipefail
          THRESHOLD=88
          used=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          [[ "$used" =~ ^[0-9]+$ ]] || { echo "could not read disk usage" >&2; exit 1; }
          echo "disk used: ${used}% (threshold ${THRESHOLD}%)"
          if [ "$used" -ge "$THRESHOLD" ]; then
            echo "above threshold — pruning build cache, dangling images, and old diagnostics"
            # Only age-prune BuildKit cache and dangling images. Omitting -a and
            # --volumes avoids broad removal of shared Docker assets.
            docker builder prune -f --filter "until=168h"
            docker image prune -f --filter "until=168h"
            shopt -s nullglob
            diag_directories=("$HOME"/actions-runner*/_diag)
            if (( ${#diag_directories[@]} )); then
              find "${diag_directories[@]}" -type f -mtime +7 -delete
            fi
            df -h /
          else
            echo "below threshold — nothing to do"
          fi
